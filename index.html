<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#127ae3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TestRA">
  <title>TestRA — Cámara AR GPS</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>TestRA</h1>
    <span id="statusPill" class="pill off">Inactivo</span>
  </header>

  <main class="view">
    <video id="camera" playsinline muted autoplay></video>

    <div id="overlays">
      <div class="overlay hidden" id="overlayA">
        <img src="./assets/19.jpg" alt="Contenido punto A">
      </div>
      <div class="overlay hidden" id="overlayB">
        <iframe id="ytFrame"
                title="Video punto B"
                src="https://www.youtube-nocookie.com/embed/3HYOR3SYRpQ"
                allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
      </div>
    </div>

    <div id="errorBox" class="error hidden" role="alert"></div>

    <div class="hud">
      <section class="card">
        <h2>GPS</h2>
        <dl>
          <dt>Latitud</dt><dd id="gpsLat">—</dd>
          <dt>Longitud</dt><dd id="gpsLng">—</dd>
          <dt>Precisión</dt><dd id="gpsAcc">—</dd>
        </dl>
      </section>

      <section class="card">
        <h2>Orientación</h2>
        <dl>
          <dt>Rumbo</dt><dd id="heading">—</dd>
          <dt>Norte verdadero</dt><dd id="trueNorth">—</dd>
        </dl>
      </section>

      <section class="card">
        <h2>Permisos</h2>
        <dl>
          <dt>Cámara</dt><dd id="permCamera">—</dd>
          <dt>GPS</dt><dd id="permGps">—</dd>
          <dt>Brújula</dt><dd id="permCompass">—</dd>
        </dl>
      </section>

      <section class="card">
        <h2>Puntos</h2>
        <div id="pointList"></div>
      </section>
    </div>
  </main>

  <footer class="controls">
    <button id="btnActivate" class="primary">ACTIVAR CÁMARA</button>
    <button id="btnClose" class="secondary hidden">Cerrar cámara</button>
    <button id="btnRestart" class="secondary">Reiniciar</button>
  </footer>

  <script src="./js/config.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
